name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version from tag
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "building version $v"

      - name: Check PowerShell BOM
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/check-bom.ps1

      - name: Build release assets
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build-release.ps1 -Version $env:VERSION

      - name: Run safety tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/test.ps1

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = $env:VERSION
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = "(?ms)^## \[$([regex]::Escape($v))\][^\r\n]*\r?\n(.*?)(?=^## \[|\z)"
          $m = [regex]::Match($text, $pattern)
          if ($m.Success) { $body = $m.Groups[1].Value.Trim() } else { $body = "Release v$v" }
          $body | Out-File -FilePath release-notes.md -Encoding utf8 -NoNewline

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/c-drive-cleaner-${{ env.VERSION }}-setup.exe
            dist/c-drive-cleaner-${{ env.VERSION }}-portable.zip
            dist/c-drive-cleaner-${{ env.VERSION }}-disks.zip
            dist/SHA256SUMS.txt
