name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build executable
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1 -Out "${{ github.workspace }}/dist/c-drive-cleaner.exe"

      - name: Run safety tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/test.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: c-drive-cleaner
          path: dist/c-drive-cleaner.exe
          if-no-files-found: error
