name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release assets
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build-release.ps1

      - name: Run safety tests
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/test.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c-drive-cleaner
          path: |
            dist/c-drive-cleaner-*-setup.exe
            dist/c-drive-cleaner-*-portable.zip
            dist/C盘清理助手.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
